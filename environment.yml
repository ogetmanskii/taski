tasks:
  clean:
    cmd: rmdir /s /q build
    exit-codes: [0,2]
  conan-install-debug:
    cmd: conan install . --output-folder=build --build=missing -s build_type=Debug
  conan-install-release:
    cmd: conan install . --output-folder=build --build=missing -s build_type=Release
  cmake-configure:
    depends-on: 
      - conan-install-debug
      - conan-install-release
    cmd: cmake -S . -B build
  build-release:
    depends-on: 
      - conan-install-release
      - cmake-configure
    cmd: cmake --build build --config Release
  build-debug:
    depends-on: 
      - conan-install-debug
      - cmake-configure
    cmd: cmake --build build --config Debug